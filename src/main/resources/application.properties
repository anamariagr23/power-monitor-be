# Server Configuration
server.port=8980
spring.application.name=power-monitor

# CORS Configuration
cors.allowed-origins=http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*

# CSV Data Configuration (legacy - not used when Trino is active)
#data.csv.path=classpath:data/power-sample.csv
data.csv.path=data/power-sample.csv

# WebSocket Configuration
websocket.endpoint=/ws
websocket.topic=/topic/realtime
websocket.app-prefix=/app

# Logging
logging.level.com.bigdata.power_monitor=DEBUG
logging.level.com.example.power_monitor=DEBUG
logging.level.org.springframework.web=INFO

# ============================================
# Trino JDBC Configuration
# ============================================
# Primary datasource for Hive/HDFS (historical data, statistics)
spring.datasource.url=jdbc:trino://localhost:8082/hive/energy
spring.datasource.driver-class-name=io.trino.jdbc.TrinoDriver
spring.datasource.username=trino_user

# If your Trino doesn't require a password, leave blank or omit
# spring.datasource.password=

# Disable datasource initialization (no schema migrations)
spring.jpa.defer-datasource-initialization=true

# ============================================
# Trino Catalog Information
# ============================================
# This application uses Trino to query multiple data sources:
#
# 1. Hive Catalog (hive.energy.events_training)
#    - Historical power consumption data stored in HDFS
#    - Used for: statistics, historical charts, available dates
#    - Default catalog in JDBC URL
#
# 2. Cassandra Catalog (cassandra.energy.events_by_hour)
#    - Real-time power consumption events
#    - Used for: latest real-time data display
#    - Requires Cassandra connector configured in Trino
#
# To configure Cassandra connector in Trino, create:
# <trino-home>/etc/catalog/cassandra.properties:
#   connector.name=cassandra
#   cassandra.contact-points=localhost
#   cassandra.native-protocol-port=9042
#   cassandra.load-policy.dc-aware.local-dc=datacenter1
